<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layout/public}">
<head>
    <title>로그인</title>
</head>

<div class="" layout:fragment="page-content">
    <section class="panel">
        <div class="panel-body">
            <form id="login-form">
                <div class="field-container">
                    <div class="field">
                        <input type="email" name="email" id="login-email" class="input" placeholder="이메일" autocomplete="off" autofocus>
                    </div>
                    <div class="field">
                        <input type="password" name="password" id="login-pwd" class="input" placeholder="비밀번호" autocomplete="off">
                    </div>
                    <div class="field">
                        <a href="/find-password" class="">비밀번호를 잊으셨나요?</a>
                    </div>
                </div>
                <div class="field-container">
                    <div class="field">
                        <button type="button" id="login-btn" class="button is-primary">로그인</button>
                    </div>
                    <div class="field">
                        <a href="/sign-up" class="">회원가입</a>
                    </div>
                </div>
                <span class="or-divider"></span>
                <div class="field-container">
                    <div class="field">
                        <button type="button" id="kakao-btn" class="button is-kakao">
                            <span class="icon">
                                <img src="/images/social/ico-kakao-24" alt="카카오">
                            </span>
                            <span>카카오 계정으로 시작하기</span>
                        </button>
                    </div>
                    <div class="field">
                        <button type="button" id="google-btn" class="button is-google-light">
                            <span class="icon">
                                <img src="/images/social/ico-google-24" alt="구글">
                            </span>
                            <span>구글 계정으로 시작하기</span>
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </section>
</div>

<th:block layout:fragment="page-script">
    <script src="/js/pages/index.js"></script>
</th:block>
</html>
